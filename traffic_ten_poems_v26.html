<title>TRAFFIC — composite snapshot</title>
<style>
  :root { --bg:#e9e7e0; --ink:#171717; --line:rgba(23,23,23,.24); }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); }
  body { overflow:hidden; font-family:Georgia,"Times New Roman",serif; }

  .traffic-page { width:100vw;height:100vh;min-height:620px;position:relative;overflow:hidden;background:var(--bg); }
  .traffic-title h1 { margin:0;font-size:clamp(2rem,6vw,5rem);font-weight:400;letter-spacing:.08em; }

  .traffic-field {
    position:absolute; inset:12px;
    display:grid; grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(4,1fr); gap:12px;
  top:12%;height:84%;}

  .traffic-block {
    position:relative;overflow:hidden;border:1px solid var(--line);
    background:rgba(255,255,255,.16);cursor:crosshair;
  }
  .b1{grid-column:1/3;grid-row:1}.b2{grid-column:3/6;grid-row:1}
  .b3{grid-column:1;grid-row:2}.b4{grid-column:2/4;grid-row:2}
  .b5{grid-column:4/6;grid-row:2/4}.b6{grid-column:1/3;grid-row:3}
  .b7{grid-column:3;grid-row:3}.b8{grid-column:1/3;grid-row:4}
  .b9{grid-column:3/5;grid-row:4}.b10{grid-column:5;grid-row:4}

  .traffic-label {
    position:absolute;z-index:5;top:8px;left:10px;
    font:10px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;
    opacity:.55;pointer-events:none;
  }
  .traffic-viewport { position:absolute;inset:0;overflow:hidden; }
  .traffic-track { position:absolute;display:flex;will-change:transform;pointer-events:none; }
  .horizontal .traffic-track { top:50%;left:0;white-space:nowrap;align-items:center; }
  .vertical .traffic-track { left:50%;top:0;flex-direction:column;align-items:center;white-space:nowrap; }
  .traffic-segment {
    flex:none;font-size:clamp(1.65rem,2.7vw,2.8rem);line-height:1;font-weight:400;
  }
  .vertical .traffic-segment { display:flex;flex-direction:column;align-items:center;gap:0; }
  .word { display:block;margin:0;padding:0; }

  /* The hidden composite only appears while the title is hovered. */
  .composite {
    position:absolute;z-index:25;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24vh 9vw 10vh;opacity:0;pointer-events:none;transition:opacity .45s ease;
    background:rgba(233,231,224,.94);mix-blend-mode:normal;
  }
  .composite-text {
    max-width:1100px;text-align:center;font-size:clamp(1.15rem,2.1vw,2rem);
    line-height:1.22;font-weight:400;
  }
  .traffic-page.snapshot .composite { opacity:1; }
  .traffic-page.snapshot .traffic-field { opacity:.08;transition:opacity .45s ease; }

  /* Single-poem reading state: clicking a block freezes traffic and opens that poem. */
  .single-poem {
    position:absolute; z-index:200; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:8vh 10vw;
    opacity:0; pointer-events:none;
    background:rgba(233,231,224,.97);
    transition:opacity .28s ease;
    overflow:auto;
  }
  .single-poem.active { opacity:1; pointer-events:auto; cursor:pointer; }
  .single-poem-text {
    width:min(900px,100%);
    max-height:84vh; overflow:auto;
    white-space:pre-wrap;
    font-size:clamp(1.05rem,1.55vw,1.55rem);
    line-height:1.28; font-weight:400;
    cursor:pointer;
  }
  .traffic-page.single-open .traffic-field { opacity:.04; transition:opacity .28s ease; }
  .traffic-page.single-open .composite { opacity:0 !important; pointer-events:none; }
  .traffic-page.single-open .traffic-light-block { opacity:.04; pointer-events:none; }

  @media (max-width:700px) {
    body{overflow:auto}.traffic-page{min-height:900px;height:100vh}
    .traffic-field{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);}
    .traffic-block:nth-child(n){grid-column:auto;grid-row:auto}
    .traffic-title{top:34%}.traffic-title h1{font-size:2.4rem}
    .traffic-segment{font-size:1.4rem}
    .composite{padding:10vh 8vw}.composite-text{font-size:1.2rem}
  }


  .traffic-light-block{
    position:absolute;
    left:50%;
    top:3%;
    transform:translateX(-50%);
    width:48px;
    height:48px;
    z-index:100;
    display:grid;
    place-items:center;
    border:1px solid rgba(20,20,20,.18);
    background:rgba(238,236,229,.75);
  }
  .traffic-light-button{
    width:28px;
    height:28px;
    padding:0;
    border:1px solid rgba(20,20,20,.35);
    border-radius:50%;
    background:transparent;
    display:grid;
    place-items:center;
    cursor:pointer;
  }
  .traffic-light-dot{
    display:block;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#23833b;
    box-shadow:0 0 8px rgba(35,131,59,.30);
    transition:transform .12s ease,background .2s ease,box-shadow .2s ease;

  .traffic-page.snapshot .traffic-light-dot{
    background:#b32121;
    box-shadow:0 0 8px rgba(179,33,33,.30);
  }
  .traffic-light-button:hover .traffic-light-dot{transform:scale(1.08)}
  .traffic-light-button:active .traffic-light-dot{transform:scale(.94)}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

</style>

    singleOpen=null;

    singlePoem.setAttribute('aria-hidden','true');
    page.classList.remove('single-open');
  }


  const modes=[
    {axis:'x',dir:-1,speed:1.52},{axis:'x',dir:1,speed:.78},
    {axis:'y',dir:1,speed:1.00},{axis:'x',dir:-1,speed:1.26},
    {axis:'y',dir:-1,speed:1.62},{axis:'x',dir:1,speed:.58},
    {axis:'y',dir:-1,speed:1.12},{axis:'x',dir:-1,speed:.52},
    {axis:'x',dir:1,speed:.84},{axis:'y',dir:1,speed:1.82}
  ];

  const state=blocks.map((el,i)=>{
    const track=el.querySelector('.traffic-track'),axis=el.dataset.axis;
    const direction=Number(el.dataset.direction);
    let words=source[i+1].trim().split(/\s+/);
    if(el.dataset.reverse==="true") words.reverse();

    function makeSegment(){
      const s=document.createElement('div');
      s.className='traffic-segment';

      if(axis==='y'){
        s.innerHTML=words.map(w=>`<span class="word">${w}</span>`).join('');
      }else{
        s.textContent=words.join(' ');
      }

      return s;
    }

    const a=makeSegment(),b=makeSegment();track.append(a,b);
    return {el,track,segment:a,axis,direction,speed:modes[i].speed,attention:0,position:0,segmentLength:0};
  });

  function measureAndSeed(){
    state.forEach(s=>{
      const r=s.segment.getBoundingClientRect();
      s.segmentLength=s.axis==='x'?r.width:r.height;
      s.position=s.direction<0 ? -s.segmentLength*.22 : -s.segmentLength*.78;
    });
  }

  /*
    The composite is deliberately not a seventh/eighth poem.
    It is assembled from the seven streams at the instant of stopping:
    one fragment from each, preserving their simultaneous condition.
  */
  /*
    The snapshot uses only words actually visible in the seven viewports
    at the instant the reader enters the center. Nothing hidden is sampled.
  */
  /*
    Snapshot the actual glyphs currently intersecting each viewport.
    Horizontal streams are measured character-by-character so the snapshot
    contains only text that is physically on screen at the moment of entry.
    Vertical streams continue to use their individual word elements.
  */
  function buildComposite(){
    const visible=[];

    state.forEach(s=>{
      const viewport=s.el.querySelector('.traffic-viewport');
      const vr=viewport.getBoundingClientRect();

      if(s.axis==='y'){
        const words=[...s.segment.querySelectorAll('.word')];
        const onScreen=[];

        words.forEach(word=>{
          const r=word.getBoundingClientRect();
          const cx=r.left+r.width/2;
          const cy=r.top+r.height/2;

          if(r.left>=vr.left && r.right<=vr.right && r.top>=vr.top && r.bottom<=vr.bottom){
            onScreen.push(word.textContent.trim());
          }
        });

        if(onScreen.length) visible.push(onScreen.join(' '));
        return;
      }

      /*
        Horizontal streams are captured as whole words. A word is included
        only when its entire bounding box is inside the viewport, so a word
        clipped by either edge is omitted rather than truncated.
      */
      const words=s.segment.textContent.trim().split(/\s+/);
      if(!words.length) return;

      const live=s.segment.getBoundingClientRect();
      const clone=s.segment.cloneNode(false);
      clone.style.position='fixed';
      clone.style.left=`${live.left}px`;
      clone.style.top=`${live.top}px`;
      clone.style.transform='none';
      clone.style.visibility='hidden';
      clone.style.pointerEvents='none';
      clone.style.whiteSpace='nowrap';
      clone.style.width='max-content';
      clone.textContent='';

      const spans=words.map((word,i)=>{
        const span=document.createElement('span');
        span.textContent=(i?' ':'')+word;
        span.style.display='inline';
        clone.appendChild(span);
        return span;
      });

      document.body.appendChild(clone);

      const captured=[];
      spans.forEach(span=>{
        const r=span.getBoundingClientRect();
        if(r.left>=vr.left && r.right<=vr.right &&
           r.top>=vr.top && r.bottom<=vr.bottom){
          captured.push(span.textContent.trim());
        }
      });

      clone.remove();

      if(captured.length) visible.push(captured.join(' '));
    });

    compositeText.textContent=visible.join('   ');
  }

  let snapshot=false;


  const snapshotButton = document.getElementById('snapshotButton');
  snapshotButton.addEventListener('click', (event) => {
    event.preventDefault();

    if (!snapshot) {
      // Capture first, while the streams are still in their exact current positions.
      buildComposite();
      snapshot = true;
      page.classList.add('snapshot');
      snapshotButton.setAttribute('aria-label','Restart traffic');
      snapshotButton.setAttribute('aria-label','Restart traffic');
    } else {
      snapshot = false;
      page.classList.remove('snapshot');
      snapshotButton.setAttribute('aria-label','Stop traffic and take a snapshot');
      snapshotButton.setAttribute('aria-label','Stop traffic and take a snapshot');
    }
  });

  blocks.forEach((block,i)=>{
    block.addEventListener('click',()=>openSinglePoem(i+1));
  });
  singlePoem.addEventListener('click',closeSinglePoem);
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape') closeSinglePoem();
  });

  let last=performance.now();

  function frame(now){
    const dt=Math.min(40,now-last);last=now;

    state.forEach(s=>{
      const hovered=s.el.matches(':hover');
      const target=hovered?1:0;

      /* Nearly imperceptible, very gradual slowing; it remains in motion. */
      const response=hovered?.010:.006;
      s.attention+=(target-s.attention)*Math.min(1,response*dt);

      const speed=s.speed*(1-s.attention*.52);
      const effectiveSpeed=(snapshot || singleOpen!==null)?0:speed;

      s.position+=s.direction*effectiveSpeed*(dt/16.67);

      const L=s.segmentLength||1;
      if(s.position<=-L)s.position+=L;
      if(s.position>=0)s.position-=L;

      s.track.style.transform=s.axis==='x'
        ? `translate3d(${s.position}px,-50%,0)`
        : `translate3d(-50%,${s.position}px,0)`;
    });

    requestAnimationFrame(frame);
  }

  measureAndSeed();
  window.addEventListener('resize',measureAndSeed);
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
